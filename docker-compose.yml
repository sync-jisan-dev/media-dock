version: "3.8"

services:
  # MediaDock Backend (Snagbox API Engine + Mobile Gateway)
  api:
    build:
      context: ./backend/snagbox
      dockerfile: Dockerfile
    container_name: mediadock-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-mediadock_secret_pass}@postgres:5432/mediadock?schema=public
      - REDIS_URL=redis://redis:6379
      - AUTH_DISABLED=false
      - FILE_LINK_SECRET=${FILE_LINK_SECRET:-generate_secure_random_hmac_secret_32_chars_min}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-generate_secure_better_auth_secret_32_chars}
      - STORAGE_DRIVER=local
      - STORAGE_QUOTA_BYTES=10737418240 # 10 GB
      - ALLOW_GENERIC_URLS=true
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - mediadock_downloads:/app/downloads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/v2/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: mediadock-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mediadock_secret_pass}
      - POSTGRES_DB=mediadock
    volumes:
      - mediadock_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mediadock"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue Broker
  redis:
    image: redis:7-alpine
    container_name: mediadock-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - mediadock_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mediadock_downloads:
  mediadock_pgdata:
  mediadock_redisdata:
