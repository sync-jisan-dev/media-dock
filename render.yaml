services:
  - type: web
    name: media-dock
    runtime: docker
    dockerfilePath: backend/snagbox/Dockerfile
    dockerContext: backend/snagbox
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: GUEST_SESSION_SECRET
        generateValue: true
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: FILE_LINK_SECRET
        generateValue: true
      - key: AUTH_DISABLED
        value: "true"
      - key: STORAGE_DRIVER
        value: local
      - key: ALLOW_GENERIC_URLS
        value: "true"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: LOG_LEVEL
        value: info
